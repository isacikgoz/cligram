name: playground

# Builds the browser playground, checks it end to end in headless
# Chromium, and on main publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: harness/pixels/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: harness/pixels
      - name: build cligram for the browser
        run: make playground
      - name: use the page as a visitor would
        run: mkdir -p shots && node harness/pixels/playground.mjs shots
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playground
          path: shots/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
